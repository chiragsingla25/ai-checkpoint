[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-checkpoint"
version = "0.1.0"
description = "Named restore points for AI chats, stored as JSON in a local git repo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest"]

[project.scripts]
ai-checkpoint = "ai_checkpoint.cli:main"
ai-checkpoint-mcp = "ai_checkpoint.server:main"
checkpoint-eval = "ai_checkpoint.eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
